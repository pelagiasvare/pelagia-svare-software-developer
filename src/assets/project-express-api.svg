<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" width="1024" height="700">
  <defs>
    <linearGradient id="bgGradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <rect width="1024" height="700" fill="url(#bgGradApi)" />

  <!-- Subdued ambient circles -->
  <circle cx="850" cy="150" r="160" fill="#22c55e" opacity="0.12" />
  <circle cx="150" cy="550" r="180" fill="#3b82f6" opacity="0.1" />

  <g transform="translate(62, 50)">
    <!-- Window Frame -->
    <rect width="900" height="600" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="2" />

    <!-- Top bar -->
    <rect width="900" height="48" rx="16" fill="#182234" />
    <rect y="32" width="900" height="16" fill="#182234" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="450" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Express.js RESTful API &amp; CRUD Middleware Architecture</text>

    <!-- Content Split: Endpoints on Left, JSON Response on Right -->
    <!-- Left Column: Endpoints list -->
    <g transform="translate(30, 75)">
      <rect width="380" height="480" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="20" y="32" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">REGISTERED API ROUTES</text>

      <!-- Route 1: GET -->
      <g transform="translate(16, 50)">
        <rect width="348" height="64" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <rect x="12" y="18" width="55" height="28" rx="4" fill="#065f46" />
        <text x="39" y="36" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">GET</text>
        <text x="80" y="36" fill="#f9fafb" font-family="monospace" font-size="13">/api/v1/todos</text>
        <text x="320" y="36" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">200 OK</text>
      </g>

      <!-- Route 2: POST -->
      <g transform="translate(16, 126)">
        <rect width="348" height="64" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" />
        <rect x="12" y="18" width="55" height="28" rx="4" fill="#1e40af" />
        <text x="39" y="36" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">POST</text>
        <text x="80" y="36" fill="#f9fafb" font-family="monospace" font-size="13">/api/v1/todos</text>
        <text x="315" y="36" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">201 Created</text>
      </g>

      <!-- Route 3: PUT -->
      <g transform="translate(16, 202)">
        <rect width="348" height="64" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <rect x="12" y="18" width="55" height="28" rx="4" fill="#854d0e" />
        <text x="39" y="36" fill="#facc15" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">PUT</text>
        <text x="80" y="36" fill="#f9fafb" font-family="monospace" font-size="13">/api/v1/todos/:id</text>
        <text x="320" y="36" fill="#eab308" font-family="sans-serif" font-size="11" font-weight="600">200 OK</text>
      </g>

      <!-- Route 4: DELETE -->
      <g transform="translate(16, 278)">
        <rect width="348" height="64" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <rect x="12" y="18" width="55" height="28" rx="4" fill="#991b1b" />
        <text x="39" y="36" fill="#f87171" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">DEL</text>
        <text x="80" y="36" fill="#f9fafb" font-family="monospace" font-size="13">/api/v1/todos/:id</text>
        <text x="320" y="36" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="600">204 OK</text>
      </g>

      <!-- Middleware Badges -->
      <g transform="translate(16, 360)">
        <text x="10" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">MIDDLEWARE CHAIN</text>
        <rect x="10" y="32" width="95" height="26" rx="6" fill="#312e81" />
        <text x="57" y="49" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">cors()</text>

        <rect x="115" y="32" width="105" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="167" y="49" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">express.json()</text>

        <rect x="230" y="32" width="105" height="26" rx="6" fill="#14532d" />
        <text x="282" y="49" fill="#bbf7d0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">errorHandler()</text>
      </g>
    </g>

    <!-- Right Column: Code and JSON response -->
    <g transform="translate(435, 75)">
      <rect width="435" height="480" rx="10" fill="url(#codeGrad)" stroke="#1f2937" stroke-width="1" />

      <!-- Tab header -->
      <rect width="435" height="40" rx="10" fill="#161e2e" />
      <rect y="30" width="435" height="10" fill="#161e2e" />
      <text x="25" y="25" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">HTTP/1.1 201 Created</text>
      <text x="350" y="25" fill="#10b981" font-family="monospace" font-size="11">Time: 18ms</text>

      <!-- JSON content -->
      <g transform="translate(25, 65)">
        <text y="20" fill="#e2e8f0" font-family="monospace" font-size="13">{</text>
        <text y="45" fill="#93c5fd" font-family="monospace" font-size="13">  &quot;success&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#4ade80">true</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="70" fill="#93c5fd" font-family="monospace" font-size="13">  &quot;message&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">&quot;Todo created successfully&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="95" fill="#93c5fd" font-family="monospace" font-size="13">  &quot;data&quot;<tspan fill="#e2e8f0">: {</tspan></text>
        <text y="120" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;id&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#f87171">&quot;td_981a2f4c&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="145" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;title&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">&quot;Implement JWT Authentication&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="170" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;completed&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#4ade80">false</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="195" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;priority&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">&quot;high&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="220" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;createdAt&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">&quot;2026-09-10T14:10:00Z&quot;</tspan></text>
        <text y="245" fill="#e2e8f0" font-family="monospace" font-size="13">  },</text>
        <text y="270" fill="#93c5fd" font-family="monospace" font-size="13">  &quot;meta&quot;<tspan fill="#e2e8f0">: {</tspan></text>
        <text y="295" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;version&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">&quot;1.0.0&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text y="320" fill="#93c5fd" font-family="monospace" font-size="13">    &quot;author&quot;<tspan fill="#e2e8f0">: </tspan><tspan fill="#fcd34d">&quot;Pelagia Svare&quot;</tspan></text>
        <text y="345" fill="#e2e8f0" font-family="monospace" font-size="13">  }</text>
        <text y="370" fill="#e2e8f0" font-family="monospace" font-size="13">}</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" width="1024" height="700">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="btnCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="1024" height="700" fill="url(#calcBg)" />
  <circle cx="800" cy="200" r="150" fill="#f97316" opacity="0.12" />
  <circle cx="200" cy="500" r="160" fill="#38bdf8" opacity="0.12" />

  <g transform="translate(62, 40)">
    <!-- Container -->
    <rect width="900" height="620" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Topbar -->
    <rect width="900" height="44" rx="16" fill="#1e293b" />
    <rect y="30" width="900" height="14" fill="#1e293b" />
    <circle cx="28" cy="22" r="6" fill="#ef4444" />
    <circle cx="48" cy="22" r="6" fill="#f59e0b" />
    <circle cx="68" cy="22" r="6" fill="#10b981" />
    <text x="450" y="28" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Python Scientific &amp; Multi-Function Mathematical Calculator</text>

    <!-- Split view: Calculator on Left, Python REPL on Right -->
    <g transform="translate(40, 65)">
      <!-- Calculator Body -->
      <rect width="360" height="520" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

      <!-- Screen -->
      <g transform="translate(20, 20)">
        <rect width="320" height="90" rx="8" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="305" y="32" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="end">sin(π/2) + √(144) × 2^3</text>
        <text x="305" y="72" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="700" text-anchor="end">97.0</text>
      </g>

      <!-- Keypad Grid -->
      <g transform="translate(20, 125)">
        <!-- Row 1: Sci Functions -->
        <rect x="0" y="0" width="58" height="42" rx="6" fill="url(#btnCyan)" />
        <text x="29" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">sin</text>

        <rect x="66" y="0" width="58" height="42" rx="6" fill="url(#btnCyan)" />
        <text x="95" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">cos</text>

        <rect x="132" y="0" width="58" height="42" rx="6" fill="url(#btnCyan)" />
        <text x="161" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">tan</text>

        <rect x="198" y="0" width="58" height="42" rx="6" fill="url(#btnCyan)" />
        <text x="227" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">√x</text>

        <rect x="264" y="0" width="58" height="42" rx="6" fill="#ef4444" />
        <text x="293" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">AC</text>

        <!-- Row 2: Sci row 2 -->
        <rect x="0" y="50" width="58" height="42" rx="6" fill="#334155" />
        <text x="29" y="76" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">x^y</text>

        <rect x="66" y="50" width="58" height="42" rx="6" fill="#334155" />
        <text x="95" y="76" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">ln</text>

        <rect x="132" y="50" width="58" height="42" rx="6" fill="#334155" />
        <text x="161" y="76" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">log</text>

        <rect x="198" y="50" width="58" height="42" rx="6" fill="#334155" />
        <text x="227" y="76" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">π</text>

        <rect x="264" y="50" width="58" height="42" rx="6" fill="url(#btnOrange)" />
        <text x="293" y="76" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">÷</text>

        <!-- Row 3: 7 8 9 * -->
        <rect x="0" y="100" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="36" y="130" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">7</text>

        <rect x="80" y="100" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="116" y="130" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">8</text>

        <rect x="160" y="100" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="196" y="130" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">9</text>

        <rect x="240" y="100" width="80" height="46" rx="6" fill="url(#btnOrange)" />
        <text x="280" y="130" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">×</text>

        <!-- Row 4: 4 5 6 - -->
        <rect x="0" y="154" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="36" y="184" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">4</text>

        <rect x="80" y="154" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="116" y="184" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">5</text>

        <rect x="160" y="154" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="196" y="184" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">6</text>

        <rect x="240" y="154" width="80" height="46" rx="6" fill="url(#btnOrange)" />
        <text x="280" y="184" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">−</text>

        <!-- Row 5: 1 2 3 + -->
        <rect x="0" y="208" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="36" y="238" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">1</text>

        <rect x="80" y="208" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="116" y="238" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">2</text>

        <rect x="160" y="208" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="196" y="238" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">3</text>

        <rect x="240" y="208" width="80" height="46" rx="6" fill="url(#btnOrange)" />
        <text x="280" y="238" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">+</text>

        <!-- Row 6: 0 . = -->
        <rect x="0" y="262" width="152" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="76" y="292" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">0</text>

        <rect x="160" y="262" width="72" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="196" y="292" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">.</text>

        <rect x="240" y="262" width="80" height="46" rx="6" fill="#10b981" />
        <text x="280" y="292" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">=</text>
      </g>
    </g>

    <!-- Right Side: Python Code Demonstration -->
    <g transform="translate(430, 65)">
      <rect width="430" height="520" rx="14" fill="#020617" stroke="#334155" stroke-width="1" />
      <rect width="430" height="38" rx="14" fill="#0f172a" />
      <rect y="28" width="430" height="10" fill="#0f172a" />
      <text x="20" y="25" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">calculator.py</text>
      <text x="350" y="25" fill="#eab308" font-family="monospace" font-size="11">Python 3.12</text>

      <g transform="translate(20, 55)">
        <text y="20" fill="#f43f5e" font-family="monospace" font-size="12">import <tspan fill="#e2e8f0">math, random</tspan></text>
        <text y="48" fill="#a855f7" font-family="monospace" font-size="12">class <tspan fill="#38bdf8">ScientificCalculator</tspan><tspan fill="#e2e8f0">:</tspan></text>
        <text y="76" fill="#f43f5e" font-family="monospace" font-size="12">    def <tspan fill="#60a5fa">calculate</tspan><tspan fill="#e2e8f0">(self, op, a, b=None):</tspan></text>
        <text y="104" fill="#94a3b8" font-family="monospace" font-size="12">        match op:</text>
        <text y="132" fill="#94a3b8" font-family="monospace" font-size="12">            case &quot;add&quot;: return a + b</text>
        <text y="160" fill="#94a3b8" font-family="monospace" font-size="12">            case &quot;sqrt&quot;: return math.sqrt(a)</text>
        <text y="188" fill="#94a3b8" font-family="monospace" font-size="12">            case &quot;trig_sin&quot;: return math.sin(a)</text>
        <text y="216" fill="#94a3b8" font-family="monospace" font-size="12">            case &quot;hyp_cosh&quot;: return math.cosh(a)</text>
        <text y="244" fill="#94a3b8" font-family="monospace" font-size="12">            case &quot;power&quot;: return math.pow(a, b)</text>
        <text y="272" fill="#94a3b8" font-family="monospace" font-size="12">            case &quot;random&quot;: return random.random()</text>

        <!-- Output banner -->
        <rect y="310" width="390" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="15" y="338" fill="#34d399" font-family="monospace" font-size="11">&gt;&gt;&gt; calc = ScientificCalculator()</text>
        <text x="15" y="364" fill="#34d399" font-family="monospace" font-size="11">&gt;&gt;&gt; calc.calculate(&quot;sqrt&quot;, 144)</text>
        <text x="15" y="386" fill="#fcd34d" font-family="monospace" font-size="11">12.0</text>
        <text x="15" y="408" fill="#38bdf8" font-family="monospace" font-size="11">&gt;&gt;&gt; calc.calculate(&quot;trig_sin&quot;, math.pi/2)  # 1.0</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" width="1024" height="700">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1024" height="700" fill="url(#skyGrad)" />

  <!-- Sun element -->
  <circle cx="850" cy="120" r="90" fill="url(#sunGrad)" opacity="0.8" />
  <circle cx="850" cy="120" r="130" fill="#fbbf24" opacity="0.15" />

  <!-- Cloud graphics -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="180" cy="180" r="60" />
    <circle cx="240" cy="160" r="75" />
    <circle cx="310" cy="180" r="60" />
    <rect x="180" y="180" width="130" height="60" rx="20" />
  </g>

  <!-- App Window Container -->
  <g transform="translate(62, 45)">
    <rect width="900" height="610" rx="20" fill="#0f172a" opacity="0.85" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

    <!-- Window Header -->
    <rect width="900" height="46" rx="20" fill="rgba(15, 23, 42, 0.95)" />
    <rect y="30" width="900" height="16" fill="rgba(15, 23, 42, 0.95)" />
    <circle cx="28" cy="23" r="6" fill="#ef4444" />
    <circle cx="48" cy="23" r="6" fill="#f59e0b" />
    <circle cx="68" cy="23" r="6" fill="#10b981" />
    <text x="450" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">OpenWeatherMap Live Forecast Dashboard</text>

    <!-- Search Bar -->
    <g transform="translate(40, 70)">
      <rect width="820" height="52" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="30" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="500">🔍 Harare, Zimbabwe</text>
      <rect x="710" y="8" width="96" height="36" rx="8" fill="#38bdf8" />
      <text x="758" y="31" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Search</text>
    </g>

    <!-- Main Weather Banner -->
    <g transform="translate(40, 140)">
      <rect width="520" height="430" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="40" y="60" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="800">Harare</text>
      <text x="40" y="88" fill="#94a3b8" font-family="sans-serif" font-size="15">Thursday, 10 September • Live Conditions</text>

      <text x="40" y="200" fill="#ffffff" font-family="sans-serif" font-size="84" font-weight="800">26°C</text>
      <text x="260" y="160" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="700">Partly Cloudy</text>
      <text x="260" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="15">Feels like 27°C • Wind: 12 km/h NE</text>

      <!-- Key Metrics Row -->
      <g transform="translate(30, 240)">
        <rect width="140" height="85" rx="10" fill="rgba(0,0,0,0.3)" />
        <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">HUMIDITY</text>
        <text x="20" y="65" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="700">42%</text>

        <rect x="160" width="140" height="85" rx="10" fill="rgba(0,0,0,0.3)" />
        <text x="180" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">PRESSURE</text>
        <text x="180" y="65" fill="#facc15" font-family="sans-serif" font-size="24" font-weight="700">1018 hPa</text>

        <rect x="320" width="140" height="85" rx="10" fill="rgba(0,0,0,0.3)" />
        <text x="340" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">UV INDEX</text>
        <text x="340" y="65" fill="#4ade80" font-family="sans-serif" font-size="24" font-weight="700">5 Moderate</text>
      </g>

      <!-- API badge -->
      <g transform="translate(30, 360)">
        <rect width="460" height="42" rx="8" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1" />
        <text x="230" y="26" fill="#e0f2fe" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">API Status: 200 OK • Powered by OpenWeather REST Endpoints</text>
      </g>
    </g>

    <!-- 5-Day Forecast Column -->
    <g transform="translate(580, 140)">
      <rect width="280" height="430" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="24" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">5-Day Forecast</text>

      <!-- Day 1 -->
      <g transform="translate(20, 60)">
        <rect width="240" height="58" rx="8" fill="rgba(0,0,0,0.2)" />
        <text x="15" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Friday</text>
        <text x="120" y="34" fill="#fbbf24" font-family="sans-serif" font-size="16">☀️</text>
        <text x="220" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">28° / 14°</text>
      </g>

      <!-- Day 2 -->
      <g transform="translate(20, 130)">
        <rect width="240" height="58" rx="8" fill="rgba(0,0,0,0.2)" />
        <text x="15" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Saturday</text>
        <text x="120" y="34" fill="#fbbf24" font-family="sans-serif" font-size="16">⛅</text>
        <text x="220" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">27° / 15°</text>
      </g>

      <!-- Day 3 -->
      <g transform="translate(20, 200)">
        <rect width="240" height="58" rx="8" fill="rgba(0,0,0,0.2)" />
        <text x="15" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Sunday</text>
        <text x="120" y="34" fill="#38bdf8" font-family="sans-serif" font-size="16">🌧️</text>
        <text x="220" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">23° / 13°</text>
      </g>

      <!-- Day 4 -->
      <g transform="translate(20, 270)">
        <rect width="240" height="58" rx="8" fill="rgba(0,0,0,0.2)" />
        <text x="15" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Monday</text>
        <text x="120" y="34" fill="#fbbf24" font-family="sans-serif" font-size="16">☀️</text>
        <text x="220" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">29° / 16°</text>
      </g>

      <!-- Day 5 -->
      <g transform="translate(20, 340)">
        <rect width="240" height="58" rx="8" fill="rgba(0,0,0,0.2)" />
        <text x="15" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Tuesday</text>
        <text x="120" y="34" fill="#fbbf24" font-family="sans-serif" font-size="16">☀️</text>
        <text x="220" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">30° / 17°</text>
      </g>
    </g>
  </g>
</svg>

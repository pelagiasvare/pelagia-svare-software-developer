<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" width="1024" height="700">
  <defs>
    <linearGradient id="kidverseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="700" fill="url(#kidverseBg)" />

  <!-- Playful background confetti & stars -->
  <circle cx="120" cy="80" r="14" fill="#f43f5e" opacity="0.2" />
  <circle cx="920" cy="120" r="22" fill="#38bdf8" opacity="0.2" />
  <circle cx="80" cy="580" r="18" fill="#fbbf24" opacity="0.25" />
  <circle cx="940" cy="620" r="16" fill="#ec4899" opacity="0.2" />

  <!-- Browser Container -->
  <g transform="translate(48, 32)" filter="url(#shadow)">
    <!-- Main Window -->
    <rect width="928" height="636" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Window Topbar -->
    <rect width="928" height="46" rx="20" fill="#f8fafc" />
    <rect y="30" width="928" height="16" fill="#f8fafc" />
    <circle cx="28" cy="23" r="6" fill="#ef4444" />
    <circle cx="48" cy="23" r="6" fill="#f59e0b" />
    <circle cx="68" cy="23" r="6" fill="#10b981" />
    <rect x="240" y="10" width="448" height="26" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="464" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">https://kidversee.vercel.app</text>

    <!-- App Header / Navigation -->
    <g transform="translate(28, 62)">
      <!-- Logo -->
      <text x="10" y="32" fill="#f43f5e" font-family="sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">Kid<tspan fill="#8b5cf6">verse</tspan><tspan fill="#f59e0b">✨</tspan></text>

      <!-- Nav Links -->
      <text x="180" y="28" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="600">Boys</text>
      <text x="240" y="28" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="600">Girls</text>
      <text x="300" y="28" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="600">Babies</text>
      <text x="375" y="28" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="600">Toys &amp; Games</text>
      <text x="495" y="28" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="700">Deals 🏷️</text>

      <!-- Search & Cart -->
      <rect x="580" y="6" width="180" height="34" rx="17" fill="#f1f5f9" />
      <text x="600" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12">🔍 Search toys, clothes...</text>

      <rect x="775" y="6" width="90" height="34" rx="17" fill="#8b5cf6" />
      <text x="820" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cart (3)</text>
    </g>

    <!-- Hero Banner -->
    <g transform="translate(28, 120)">
      <rect width="872" height="175" rx="16" fill="url(#headerGrad)" />
      
      <!-- Hero Text -->
      <text x="36" y="55" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">Wonderland for Kids &amp; Parents 🎈</text>
      <text x="36" y="85" fill="#fdf2f8" font-family="sans-serif" font-size="14" font-weight="500">Discover premium children's clothing, educational toys, and instant delivery marketplace.</text>
      
      <!-- CTAs -->
      <rect x="36" y="112" width="140" height="38" rx="10" fill="#ffffff" />
      <text x="106" y="136" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Shop Now 🛍️</text>

      <rect x="190" y="112" width="160" height="38" rx="10" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="1.5" />
      <text x="270" y="136" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Supplier Portal →</text>

      <!-- Decorative playful badges on right -->
      <g transform="translate(680, 25)">
        <circle cx="70" cy="65" r="55" fill="rgba(255,255,255,0.18)" />
        <text x="70" y="55" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">50%</text>
        <text x="70" y="78" fill="#fef08a" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SPRING SALE</text>
      </g>
    </g>

    <!-- Product Showcase Grid -->
    <g transform="translate(28, 315)">
      <!-- Section Title -->
      <text x="0" y="24" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">Featured Collections</text>
      <text x="872" y="24" fill="#8b5cf6" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">View All (120+) →</text>

      <!-- Card 1 -->
      <g transform="translate(0, 42)">
        <rect width="272" height="255" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <rect width="272" height="135" rx="14" fill="url(#cardGrad1)" />
        <text x="136" y="80" fill="#f43f5e" font-size="46" text-anchor="middle">🧸</text>
        <rect x="12" y="12" width="65" height="22" rx="6" fill="#ef4444" />
        <text x="44.5" y="27" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">POPULAR</text>

        <text x="16" y="165" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="700">Plush Cuddle Bear</text>
        <text x="16" y="185" fill="#64748b" font-family="sans-serif" font-size="12">Organic Cotton • All Ages</text>
        
        <text x="16" y="222" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">$18.99</text>
        <rect x="168" y="200" width="88" height="34" rx="8" fill="#f43f5e" />
        <text x="212" y="222" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Add +</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(300, 42)">
        <rect width="272" height="255" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <rect width="272" height="135" rx="14" fill="url(#cardGrad2)" />
        <text x="136" y="80" fill="#0284c7" font-size="46" text-anchor="middle">👕</text>
        <rect x="12" y="12" width="65" height="22" rx="6" fill="#0ea5e9" />
        <text x="44.5" y="27" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">NEW</text>

        <text x="16" y="165" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="700">Dino Explorer Tee</text>
        <text x="16" y="185" fill="#64748b" font-family="sans-serif" font-size="12">100% Cotton • Ages 3-8</text>
        
        <text x="16" y="222" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">$14.50</text>
        <rect x="168" y="200" width="88" height="34" rx="8" fill="#0284c7" />
        <text x="212" y="222" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Add +</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(600, 42)">
        <rect width="272" height="255" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <rect width="272" height="135" rx="14" fill="url(#cardGrad3)" />
        <text x="136" y="80" fill="#d97706" font-size="46" text-anchor="middle">🎨</text>
        <rect x="12" y="12" width="65" height="22" rx="6" fill="#f59e0b" />
        <text x="44.5" y="27" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">CREATIVE</text>

        <text x="16" y="165" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="700">Montessori Art Kit</text>
        <text x="16" y="185" fill="#64748b" font-family="sans-serif" font-size="12">Non-toxic Paints • Ages 4+</text>
        
        <text x="16" y="222" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">$24.00</text>
        <rect x="168" y="200" width="88" height="34" rx="8" fill="#d97706" />
        <text x="212" y="222" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Add +</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" width="1024" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="700" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1024" height="700" fill="url(#grid)" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="180" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  <circle cx="850" cy="500" r="180" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />

  <!-- App Window Container -->
  <g transform="translate(62, 50)">
    <!-- Window Shadow & Frame -->
    <rect width="900" height="600" rx="16" fill="#1e293b" opacity="0.95" stroke="#334155" stroke-width="2" />

    <!-- Window Topbar -->
    <rect width="900" height="48" rx="16" fill="#0f172a" />
    <rect y="32" width="900" height="16" fill="#0f172a" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="450" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">AI Retrieval-Augmented Generation (RAG) Architecture</text>

    <!-- Header / Stats Bar -->
    <g transform="translate(30, 75)">
      <rect width="260" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">VECTOR EMBEDDINGS</text>
      <text x="20" y="65" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="700">1,536 Dim</text>
      <text x="175" y="62" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">text-embedding-3</text>

      <rect x="290" width="260" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="310" y="32" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">SIMILARITY SCORE</text>
      <text x="310" y="65" fill="#a855f7" font-family="sans-serif" font-size="24" font-weight="700">0.942 Cosine</text>
      <text x="470" y="62" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">Top-k: 4</text>

      <rect x="580" width="260" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="600" y="32" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">LLM SYNTHESIS</text>
      <text x="600" y="65" fill="#ec4899" font-family="sans-serif" font-size="24" font-weight="700">182 ms</text>
      <text x="730" y="62" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">GPT-4o Mini</text>
    </g>

    <!-- Pipeline Visual Flow -->
    <g transform="translate(30, 180)">
      <rect width="840" height="380" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

      <!-- Step 1: Input Document -->
      <g transform="translate(30, 30)">
        <rect width="160" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="15" y="15" width="40" height="8" rx="4" fill="#38bdf8" />
        <text x="15" y="48" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">1. Raw Doc</text>
        <rect x="15" y="62" width="130" height="6" rx="3" fill="#475569" />
        <rect x="15" y="76" width="110" height="6" rx="3" fill="#475569" />
        <rect x="15" y="90" width="125" height="6" rx="3" fill="#475569" />
        <rect x="15" y="104" width="95" height="6" rx="3" fill="#475569" />
        <rect x="15" y="130" width="130" height="28" rx="6" fill="#0369a1" />
        <text x="80" y="148" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Chunking (500t)</text>
      </g>

      <!-- Arrow 1 -->
      <path d="M 205 120 L 235 120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

      <!-- Step 2: Embeddings -->
      <g transform="translate(245, 30)">
        <rect width="160" height="180" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
        <text x="15" y="32" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="600">VECTORIZER</text>
        <text x="15" y="55" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">2. Embeddings</text>
        <circle cx="45" cy="90" r="16" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="115" cy="90" r="16" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="80" cy="130" r="18" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
        <line x1="45" y1="90" x2="80" y2="130" stroke="#6366f1" stroke-width="1" />
        <line x1="115" y1="90" x2="80" y2="130" stroke="#6366f1" stroke-width="1" />
        <rect x="15" y="155" width="130" height="18" rx="4" fill="#1e1b4b" />
        <text x="80" y="168" fill="#a5b4fc" font-family="monospace" font-size="10" text-anchor="middle">[0.024, -0.91, 0.44...]</text>
      </g>

      <!-- Arrow 2 -->
      <path d="M 420 120 L 450 120" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" />

      <!-- Step 3: Vector Store -->
      <g transform="translate(460, 30)">
        <rect width="160" height="180" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
        <text x="15" y="32" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">RETRIEVAL</text>
        <text x="15" y="55" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">3. Vector DB</text>
        <rect x="15" y="75" width="130" height="24" rx="4" fill="#3b0764" stroke="#9333ea" stroke-width="1" />
        <text x="25" y="91" fill="#f3e8ff" font-family="sans-serif" font-size="11" font-weight="600">Chunk #41 (98%)</text>
        <rect x="15" y="105" width="130" height="24" rx="4" fill="#3b0764" opacity="0.7" />
        <text x="25" y="121" fill="#e9d5ff" font-family="sans-serif" font-size="11">Chunk #12 (94%)</text>
        <rect x="15" y="135" width="130" height="24" rx="4" fill="#3b0764" opacity="0.4" />
        <text x="25" y="151" fill="#d8b4fe" font-family="sans-serif" font-size="11">Chunk #08 (89%)</text>
      </g>

      <!-- Arrow 3 -->
      <path d="M 635 120 L 665 120" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" />

      <!-- Step 4: Final LLM Answer -->
      <g transform="translate(675, 30)">
        <rect width="135" height="180" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5" />
        <text x="12" y="32" fill="#fb7185" font-family="sans-serif" font-size="11" font-weight="600">GENERATION</text>
        <text x="12" y="55" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">4. Synthesis</text>
        <rect x="12" y="75" width="111" height="60" rx="6" fill="#881337" opacity="0.8" />
        <text x="20" y="95" fill="#ffe4e6" font-family="sans-serif" font-size="10" font-weight="600">Accurate response</text>
        <text x="20" y="112" fill="#fecdd3" font-family="sans-serif" font-size="9">+ Verified Citations</text>
        <text x="20" y="125" fill="#fecdd3" font-family="sans-serif" font-size="9">[Source #41, p.3]</text>
        <rect x="12" y="145" width="111" height="24" rx="4" fill="#10b981" />
        <text x="67" y="161" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ Grounded Truth</text>
      </g>

      <!-- Live Terminal output bar at bottom -->
      <g transform="translate(30, 230)">
        <rect width="780" height="120" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="28" fill="#38bdf8" font-family="monospace" font-size="12">&gt; query: &quot;How does authentication middleware handle expired tokens?&quot;</text>
        <text x="20" y="52" fill="#a855f7" font-family="monospace" font-size="12">&gt; matching vector indices: [41, 12, 08, 93] in 14.2ms</text>
        <text x="20" y="76" fill="#34d399" font-family="monospace" font-size="12">&gt; OpenAI response streamed: 3 sentences synthesized with zero hallucinations.</text>
        <text x="20" y="100" fill="#94a3b8" font-family="monospace" font-size="11">&gt; Tokens: prompt_tokens=420, completion_tokens=86, total_cost=$0.00012</text>
      </g>
    </g>
  </g>
</svg>
